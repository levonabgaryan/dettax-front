<header>
  <div class="decorative-bar"></div>
  <div class="header-content">
    <div class="header-content__logo">
      <img ngSrc="/header-logo.png" alt="Logo" width="28" height="26" />
      <a routerLink="/home" routerLinkActive="active">Delicacies on the Table</a>
    </div>
    <nav class="header-content__navigation">
      <ul>
        <li><a routerLink="/home" routerLinkActive="active">Home</a></li>
        <li><a routerLink="/recipes" routerLinkActive="active">Recipes</a></li>
        <li><a href="#">About Us</a></li>
      </ul>
    </nav>

    <div class="header-content__right">
      <div class="header-content__search">
        <input type="text" placeholder="Search for a recipe" />
      </div>

      @if (!authService.token()) {
        <button class="btn-auth" (click)="authService.login()">Log In</button>
        <button class="btn-register" (click)="isRegisterModalOpen = true">Register</button>
      } @else {
        <button class="btn-auth btn-logout" (click)="authService.logout()">Log Out</button>
      }
    </div>
  </div>
</header>

@if (isRegisterModalOpen) {
  <app-user-register-modal (closeModal)="isRegisterModalOpen = false"></app-user-register-modal>
}
