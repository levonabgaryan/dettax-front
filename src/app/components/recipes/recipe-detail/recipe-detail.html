<app-async-state [isLoading]="isLoading()" [errorMessage]="errorMessage()">
  @if (recipe(); as r) {
    <article class="recipe-detail">
      <header class="recipe-detail__header">
        <h1 class="recipe-detail__title">{{ r.getName() }}</h1>

        <div class="recipe-detail__meta">
          <span class="recipe-detail__tag">{{ r.getCategory().getName() }}</span>
          <span class="recipe-detail__tag">{{ r.getCountry() }}</span>
        </div>
      </header>

      <div class="recipe-detail__layout">
        @if (r.getImageUrl(); as imgUrl) {
          <img
            [ngSrc]="imgUrl"
            [alt]="r.getName()"
            width="600"
            height="600"
            class="recipe-detail__image"
          />
        }

        <div class="recipe-detail__info">
          <p class="recipe-detail__description">{{ r.getDescription() }}</p>

          <section class="recipe-detail__section">
            <h2 class="recipe-detail__subtitle">Ingredients</h2>
            <ul class="recipe-detail__ingredients">
              @for (ing of r.getIngredients(); track ing) {
                <li>{{ ing }}</li>
              }
            </ul>
          </section>
        </div>
      </div>
    </article>
  } @else {
    <p class="recipe-detail__empty">Recipe not found</p>
  }
</app-async-state>
