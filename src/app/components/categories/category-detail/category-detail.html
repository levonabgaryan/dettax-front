<app-async-state [isLoading]="isLoading()" [errorMessage]="errorMessage()">
  @if (category(); as cat) {
    <article class="category-detail">
      @if (cat.getImgUrl(); as imgUrl) {
        <img
          [ngSrc]="imgUrl"
          [alt]="cat.getName()"
          width="400"
          height="300"
          class="category-detail__image"
        />
      }

      <div class="category-detail__body">
        <h1 class="category-detail__title">{{ cat.getName() }}</h1>

        @if (cat.getDescription(); as description) {
          <p class="category-detail__description">{{ description }}</p>
        }
      </div>
    </article>
  } @else {
    <p class="category-detail__empty">Category not found</p>
  }
</app-async-state>
